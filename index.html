    <style>
      body {
        font-family: 'Nunito', sans-serif;
        transition: background-color 0.5s ease;
      }
      h1, h2, h3, h4, .font-kids {
        font-family: 'Fredoka', sans-serif;
      }
      .blob-shape {
        border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
      }
      .lazy-image {
        opacity: 0;
        transition: opacity 0.8s ease-in-out, transform 0.8s ease-out;
      }
      .lazy-image.loaded {
        opacity: 1;
      }
      .shimmer-bg {
        background: linear-gradient(
          90deg,
          #fef2f2 25%,
          #fee2e2 50%,
          #fef2f2 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite linear;
      }
      @keyframes shimmer {
        from { background-position: 200% 0; }
        to { background-position: -200% 0; }
      }
      @keyframes wiggle {
        0%, 100% { transform: rotate(-6deg); }
        50% { transform: rotate(6deg); }
      }
      .animate-wiggle {
        animation: wiggle 2s ease-in-out infinite;
      }
      @keyframes bounce-gentle {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      .animate-bounce-gentle {
        animation: bounce-gentle 2s infinite;
      }
      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .animate-spin-slow {
        animation: spin-slow 8s linear infinite;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }
      @keyframes ripple {
        0% { transform: scale(1); opacity: 0.6; }
        100% { transform: scale(1.4); opacity: 0; }
      }
      .animate-ripple {
        animation: ripple 2s infinite;
      }
      .animate-ripple-delayed {
        animation: ripple 2s infinite 1s;
      }

      /* SISTEMA NEON MODO ESCURO */
      .dark-mode {
        --bg-deep: #050507;
        --bg-card: #0d0d12;
        --neon-pink: #ff007f;
        --neon-pink-glow: rgba(255, 0, 127, 0.6);
        --neon-blue: #00d9ff;
        --neon-blue-glow: rgba(0, 217, 255, 0.6);
        --neon-orange: #ff9d00;
        --neon-orange-glow: rgba(255, 157, 0, 0.6);
        --neon-purple: #bc13fe;
        --neon-purple-glow: rgba(188, 19, 254, 0.6);
        --neon-green: #39ff14;
        --neon-green-glow: rgba(57, 255, 20, 0.6);
        
        background-color: var(--bg-deep) !important;
        color: #e2e8f0;
      }

      .dark-mode section, 
      .dark-mode footer, 
      .dark-mode .bg-white,
      .dark-mode .bg-pink-50,
      .dark-mode .bg-orange-50 {
        background-color: var(--bg-deep) !important;
        background-image: none !important;
      }

      /* Títulos Neon */
      .dark-mode h1, .dark-mode h2, .dark-mode h3 {
        color: #fff !important;
        text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px var(--neon-pink-glow);
      }

      /* Efeito Neon em Blocos e Cards */
      .dark-mode .group, 
      .dark-mode .rounded-\[2\.5rem\],
      .dark-mode .rounded-\[3rem\],
      .dark-mode .rounded-\[3\.5rem\] {
        background-color: var(--bg-card) !important;
        border-width: 2px !important;
        transition: all 0.3s ease;
      }

      /* Variantes de cores neon para bordas e glow */
      .dark-mode .border-pink-200, .dark-mode .border-pink-100 { border-color: var(--neon-pink) !important; box-shadow: 0 0 15px var(--neon-pink-glow); }
      .dark-mode .border-blue-200, .dark-mode .border-blue-100 { border-color: var(--neon-blue) !important; box-shadow: 0 0 15px var(--neon-blue-glow); }
      .dark-mode .border-orange-200, .dark-mode .border-orange-100 { border-color: var(--neon-orange) !important; box-shadow: 0 0 15px var(--neon-orange-glow); }
      .dark-mode .border-purple-200 { border-color: var(--neon-purple) !important; box-shadow: 0 0 15px var(--neon-purple-glow); }
      .dark-mode .border-green-200 { border-color: var(--neon-green) !important; box-shadow: 0 0 15px var(--neon-green-glow); }
      .dark-mode .border-white { border-color: var(--neon-blue) !important; box-shadow: 0 0 20px var(--neon-blue-glow); }

      /* Neon em Imagens */
      .dark-mode img {
        filter: brightness(1.1) contrast(1.1);
      }
      .dark-mode .overflow-hidden:has(img) {
        border-color: var(--neon-pink) !important;
        box-shadow: 0 0 25px var(--neon-pink-glow);
      }

      /* Botões em Modo Dark */
      .dark-mode .bg-white.text-pink-600 {
        background-color: #000 !important;
        color: #fff !important;
        border: 2px solid var(--neon-pink) !important;
        box-shadow: 0 0 10px var(--neon-pink-glow);
      }

      .dark-mode input {
        background-color: #000 !important;
        border-color: var(--neon-pink) !important;
        color: #fff !important;
      }
    </style>
